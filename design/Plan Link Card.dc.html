<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Gaegu:wght@400;700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Patrick+Hand&subset=vietnamese&display=swap"><script src="./kithfield-art.js"></script><style>body{margin:0}kf-art{display:block}</style></helmet>
<div data-screen-label="Plan link card 1200×630" style="position:relative;width:1200px;height:630px;overflow:hidden;background:#F5EEE2;color:#2a221d;display:grid;grid-template-columns:500px 1fr;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif">
<div style="position:relative;background:{{ panel }};overflow:hidden">
<sc-if value="{{ isPast }}" hint-placeholder-val="{{ false }}"><kf-art scene="pressed" name="daisy" style="position:absolute;left:70px;top:60px;width:360px;height:480px"></kf-art></sc-if>
<sc-if value="{{ notPast }}" hint-placeholder-val="{{ true }}"><kf-art scene="seed" stage="{{ stage }}" style="position:absolute;left:40px;top:70px;width:420px;height:440px"></kf-art></sc-if>
<kf-art scene="avatar" kind="rabbit" style="position:absolute;left:40px;bottom:40px;width:96px;height:96px;border-radius:48px;overflow:hidden;box-shadow:0 0 0 6px #F5EEE2"></kf-art>
</div>
<div style="display:flex;flex-direction:column;gap:26px;padding:56px 64px 48px 60px;min-width:0">
<div style="display:flex;align-items:baseline;gap:16px"><span style="font:400 36px/1 {{ serif }}">Kithfield</span><span style="font:700 30px/1 {{ handF }};color:#5E7F4A">{{ kicker }}</span></div>
<div style="font:400 76px/1.02 {{ serif }};letter-spacing:-.01em;text-wrap:pretty">{{ title }}</div>
<div style="font:30px/1.2 -apple-system,system-ui;color:#5b5048">{{ planter }}</div>
<sc-if value="{{ isOpen }}" hint-placeholder-val="{{ true }}"><div style="display:flex;gap:18px">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="3"><div style="display:flex;align-items:center;gap:10px;padding:14px 26px 14px 14px;border-radius:44px;background:#fffaf2;border:2px solid rgba(42,34,29,.12)"><kf-art scene="seed" stage="1" style="width:52px;height:52px"></kf-art><span style="font:600 30px/1 -apple-system,system-ui">{{ d }}</span></div></sc-for></div></sc-if>
<sc-if value="{{ isSprouted }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:10px"><div style="font:700 32px/1 {{ handF }};color:#5E7F4A">{{ sproutLine }}</div><div style="font:600 40px/1.15 -apple-system,system-ui">{{ when }}</div><div style="font:30px/1.2 -apple-system,system-ui;color:#5b5048">{{ place }}</div></div></sc-if>
<sc-if value="{{ isPast }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:10px"><div style="font:600 38px/1.15 -apple-system,system-ui">{{ pastLine }}</div><div style="font:30px/1.25 -apple-system,system-ui;color:#5b5048">{{ pastSub }}</div></div></sc-if>
<div style="margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;font:26px/1 -apple-system,system-ui;color:#6b5f55"><span>{{ cta }}</span><span>kithfield.com</span></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:630},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;open&quot;,&quot;sprouted&quot;,&quot;past&quot;],&quot;default&quot;:&quot;open&quot;,&quot;tsType&quot;:&quot;'open'|'sprouted'|'past'&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;vi&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;'en'|'vi'&quot;}}">
const C = {
  en: { kicker: 'a plan from the Thursday Lot', title: 'Picnic by the river', planter: 'June planted this', days: ['Sat 25', 'Sun 26', 'Sat 1'], sproutLine: 'it sprouted', when: 'Saturday 25 October · 4pm', place: 'Riverside meadow, by the boathouse', pastLine: 'This picnic was on 25 October', pastSub: "It's pressed in the farm's scrapbook now.", ctaOpen: 'Answer in a tap. No app needed.', ctaSprout: 'See who is coming', ctaPast: 'Open the scrapbook' },
  vi: { kicker: 'kế hoạch từ Vườn Thứ Năm', title: 'Dã ngoại bên sông', planter: 'June gieo hạt này', days: ['T7 25/10', 'CN 26/10', 'T7 1/11'], sproutLine: 'hạt đã nảy mầm', when: 'Thứ Bảy, 25 tháng 10 · 16:00', place: 'Bãi cỏ ven sông, cạnh nhà thuyền', pastLine: 'Buổi dã ngoại đã diễn ra ngày 25/10', pastSub: 'Giờ đã được ép vào sổ lưu niệm của vườn.', ctaOpen: 'Trả lời chỉ một chạm. Không cần ứng dụng.', ctaSprout: 'Xem ai sẽ đến', ctaPast: 'Mở sổ lưu niệm' }
};
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state ?? 'open', c = C[this.props.lang === 'vi' ? 'vi' : 'en'];
    const vi = this.props.lang === 'vi';
    return { ...c, serif: vi ? "'Lora',Georgia,serif" : "'Young Serif',Georgia,serif", handF: vi ? "'Patrick Hand',cursive" : 'Gaegu,cursive', isOpen: st === 'open', isSprouted: st === 'sprouted', isPast: st === 'past', notPast: st !== 'past', stage: st === 'open' ? '1' : '3',
      panel: st === 'past' ? '#efe4d0' : st === 'sprouted' ? '#e4ecd6' : '#EFE2C8', cta: st === 'open' ? c.ctaOpen : st === 'sprouted' ? c.ctaSprout : c.ctaPast };
  }
}
</script>
</body>
</html>
