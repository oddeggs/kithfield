plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.kithfield'
version = '1.0.0'

android {
  namespace "com.kithfield.androidsystem"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // `OnBackPressedCallback` with the back gesture's progress (`BackEventCompat`), for the back preview.
  implementation 'androidx.activity:activity:1.8.2'
}
